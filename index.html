<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY 22nd BIRTHDAY KARTIKK</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: radial-gradient(circle at top, #8f0b19 0%, #520009 100%);
  font-family: "Times New Roman", Times, serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  color: #241916;
}

.scrapbook-container {
  position: relative;
  width: 94vw;
  max-width: 1120px;
  height: 86vh;
  max-height: 760px;
  background: #fdfbf7;
  border-radius: 18px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
  border: 8px solid #a8111f;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.slides-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease, transform 0.35s ease;
  transform: translateX(18px);
  padding: 20px 24px 72px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: #fdfbf7;
}

.slide.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0);
}

.wavy-frame {
  border: 3px dashed #b81424;
  border-radius: 14px;
  padding: 22px 28px;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(circle, #fffdf9 0%, #f6efe2 100%);
  overflow: hidden;
}

h1 {
  font-family: "Times New Roman", Times, serif;
  font-size: clamp(2rem, 3.6vw, 3rem);
  font-weight: bold;
  color: #b81424;
  margin-bottom: 10px;
  line-height: 1.15;
}

h2 {
  font-family: "Times New Roman", Times, serif;
  font-size: clamp(1.45rem, 2.4vw, 2.1rem);
  font-weight: bold;
  color: #8b0000;
  margin-bottom: 12px;
  line-height: 1.25;
}

p {
  font-family: "Times New Roman", Times, serif;
  font-size: clamp(1.05rem, 1.45vw, 1.25rem);
  color: #2b211e;
  line-height: 1.55;
}

/* SLIDE 1 */

.envelope-bg {
  background: linear-gradient(135deg, #b31322 0%, #6e030e 100%);
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  position: relative;
}

.envelope-flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 46%;
  background: rgba(90, 0, 10, 0.45);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  z-index: 2;
  pointer-events: none;
}

.wax-seal-btn {
  width: 104px;
  height: 104px;
  background: radial-gradient(circle, #ffe57f 0%, #d4af37 68%, #8f6212 100%);
  border-radius: 50%;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45),
              inset 0 3px 6px rgba(255, 255, 255, 0.75);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 38px;
  z-index: 5;
  animation: sealPulse 2s infinite;
  border: 3px solid #b8860b;
}

.envelope-hint {
  margin-top: 18px;
  z-index: 5;
  color: #fff5e6;
  font-size: 1.2rem;
  letter-spacing: 0.5px;
}

@keyframes sealPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

/* SLIDE 3 - LETTER */

.letter-frame {
  justify-content: flex-start;
  text-align: left;
}

.letter-frame h2 {
  width: 100%;
  text-align: center;
  padding-bottom: 10px;
  border-bottom: 1px dashed #d6b8b8;
  margin-bottom: 14px;
  flex-shrink: 0;
}

.letter-scroll {
  width: 100%;
  flex: 1;
  overflow-y: auto;
  padding-right: 12px;
  padding-bottom: 18px;
}

.letter-scroll p {
  white-space: pre-line;
  text-align: left;
  font-size: clamp(1.05rem, 1.3vw, 1.2rem);
  line-height: 1.65;
  color: #241916;
}

.letter-scroll::-webkit-scrollbar {
  width: 8px;
}

.letter-scroll::-webkit-scrollbar-thumb {
  background: #c56b73;
  border-radius: 8px;
}
